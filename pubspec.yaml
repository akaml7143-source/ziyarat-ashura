name: ashura_visit
description: تطبيق زيارة عاشوراء
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  vibration: ^3.1.3
  awesome_notifications_core: ^0.11.0
  awesome_notifications: ^0.11.0
  just_audio: ^0.9.36
  audio_service: ^0.18.15

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ashura_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/Amiri-Regular.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/AmiriQuran.ttf
