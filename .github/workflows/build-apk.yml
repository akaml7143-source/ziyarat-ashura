
name: Build Ziyarat Ashura APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare approved Arabic fonts
        run: |
          set -euo pipefail
          python3 -m pip install --quiet fonttools
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from fontTools.ttLib import TTFont
          import shutil
          import re

          archive = Path("assets/Amiri,Aref_Ruqaa,Cairo,Reem_Kufi,Tajawal.zip")
          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit("The approved Arabic font bundle is missing or empty")

          extracted = Path("assets/font_bundle")
          output = Path("assets/selected_fonts")
          extracted.mkdir(parents=True, exist_ok=True)
          output.mkdir(parents=True, exist_ok=True)

          with ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  if item.is_dir():
                      continue
                  if Path(item.filename).suffix.lower() in (".ttf", ".otf"):
                      target = extracted / Path(item.filename).name
                      target.write_bytes(bundle.read(item))

          def family_names(path):
              font = TTFont(path, lazy=True)
              names = []
              for record in font["name"].names:
                  if record.nameID in (1, 16, 21):
                      try:
                          names.append(record.toUnicode())
                      except Exception:
                          pass
              font.close()
              return " ".join(names).lower()

          fonts = list(extracted.glob("*.ttf")) + list(extracted.glob("*.otf"))
          aliases = {
              "ArefRuqaa": lambda names, filename: ("aref" in names and "ruqaa" in names) or "aref" in filename,
              "Cairo": lambda names, filename: "cairo" in names or "cairo" in filename,
              "ReemKufi": lambda names, filename: ("reem" in names and "kufi" in names) or "reem" in filename,
              "Tajawal": lambda names, filename: "tajawal" in names or "tajawal" in filename,
          }

          for family, matcher in aliases.items():
              matches = []
              for path in fonts:
                  metadata = family_names(path)
                  filename = re.sub(r"[^a-z]", "", path.stem.lower())
                  if matcher(metadata, filename):
                      matches.append(path)
              if not matches:
                  raise SystemExit(f"Font family not found in approved ZIP: {family}")
              shutil.copy2(matches[0], output / f"{family}.ttf")
              print(f"Prepared {family}: {matches[0].name}")

          for required in ("Amiri-Regular.ttf", "AmiriQuran.ttf"):
              path = Path("assets") / required
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Required font file is missing: {path}")

          print("All six approved font families are ready")
          PY

      - name: Create Android platform
        run: flutter create --platforms=android .

      - name: Configure Firebase Android plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          source = Path("google-services.json")
          if not source.exists():
              raise SystemExit("google-services.json is missing from repository root")
          shutil.copy2(source, Path("android/app/google-services.json"))

          settings = Path("android/settings.gradle.kts")
          if settings.exists():
              s = settings.read_text()
              if "com.google.gms.google-services" not in s:
                  s, count = re.subn(
                      r'plugins\s*\{',
                      lambda m: m.group(0) + '\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                      s, count=1
                  )
                  if count == 0:
                      raise SystemExit("Gradle settings plugins block not found")
              settings.write_text(s)
          else:
              settings = Path("android/settings.gradle")
              s = settings.read_text()
              if "com.google.gms.google-services" not in s:
                  s, count = re.subn(
                      r'plugins\s*\{',
                      lambda m: m.group(0) + "\n    id 'com.google.gms.google-services' version '4.4.4' apply false",
                      s, count=1
                  )
                  if count == 0:
                      raise SystemExit("Gradle settings plugins block not found")
              settings.write_text(s)

          app = Path("android/app/build.gradle.kts")
          if app.exists():
              s = app.read_text()
              if 'id("com.google.gms.google-services")' not in s:
                  s, count = re.subn(
                      r'plugins\s*\{',
                      lambda m: m.group(0) + '\n    id("com.google.gms.google-services")',
                      s, count=1
                  )
                  if count == 0:
                      raise SystemExit("App Gradle plugins block not found")
              app.write_text(s)
          else:
              app = Path("android/app/build.gradle")
              s = app.read_text()
              if "com.google.gms.google-services" not in s:
                  s, count = re.subn(
                      r'plugins\s*\{',
                      lambda m: m.group(0) + "\n    id 'com.google.gms.google-services'",
                      s, count=1
                  )
                  if count == 0:
                      raise SystemExit("App Gradle plugins block not found")
              app.write_text(s)

          print("Firebase Android Gradle plugin configured")
          PY

      - name: Configure notification and audio permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          # الاسم الذي يظهر أسفل أيقونة التطبيق على الهاتف.
          s = re.sub(r'android:label="[^"]+"', 'android:label="زيارة عاشوراء"', s, count=1)

          permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.WAKE_LOCK",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]

          for permission in permissions:
              if permission not in s:
                  tag = f'<uses-permission android:name="{permission}" />'
                  s = re.sub(
                      r'(<application\b)',
                      lambda m: tag + '\n    ' + m.group(1),
                      s,
                      count=1
                  )

          # تغيير MainActivity إلى AudioServiceActivity
          if "com.ryanheise.audioservice.AudioServiceActivity" not in s:
              pattern = r'(<activity\b[^>]*android:name=")[^"]*MainActivity(")'
              s, count = re.subn(
                  pattern,
                  lambda m: m.group(1) +
                            "com.ryanheise.audioservice.AudioServiceActivity" +
                            m.group(2),
                  s,
                  count=1
              )

              if count == 0:
                  raise SystemExit("MainActivity not found in AndroidManifest.xml")

          # إظهار التنبيه على شاشة القفل وإيقاظ الشاشة عند وجود صلاحية ملء الشاشة.
          activity_pattern = r'<activity\b(?=[^>]*android:name="com\.ryanheise\.audioservice\.AudioServiceActivity")[^>]*>'
          match = re.search(activity_pattern, s)
          if match is None:
              raise SystemExit("AudioServiceActivity not found for lock-screen notification setup")
          activity_tag = match.group(0)
          for attribute in ("android:showWhenLocked", "android:turnScreenOn"):
              if attribute not in activity_tag:
                  activity_tag = activity_tag[:-1] + f' {attribute}="true">'
          s = s[:match.start()] + activity_tag + s[match.end():]

          # Deep links let a shared khatma open directly inside the app.
          if 'android:scheme="ziyaratashura"' not in s:
              activity_start = s.find(activity_tag)
              activity_end = s.find("</activity>", activity_start)
              if activity_start < 0 or activity_end < 0:
                  raise SystemExit("AudioServiceActivity closing tag not found for khatma deep links")
              deep_link_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="ziyaratashura" android:host="khatma" />
                  </intent-filter>
              '''
              s = s[:activity_end] + deep_link_filter + s[activity_end:]

          # إضافة خدمة تشغيل الصوت بالخلفية
          if 'android:name="com.ryanheise.audioservice.AudioService"' not in s:
              audio_components = '''
              <service
                  android:name="com.ryanheise.audioservice.AudioService"
                  android:foregroundServiceType="mediaPlayback"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.media.browse.MediaBrowserService" />
                  </intent-filter>
              </service>

              <receiver
                  android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MEDIA_BUTTON" />
                  </intent-filter>
              </receiver>
              '''
              s = s.replace(
                  "</application>",
                  audio_components + "\n</application>"
              )

          # Flutter Local Notifications scheduled notification receivers.
          if 'com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver' not in s:
              local_receivers = '''
              <receiver
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"
                  android:exported="false" />
              <receiver
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
              '''
              s = s.replace("</application>", local_receivers + "\n</application>")

          # Flutter Local Notifications 17 needs a recent compile SDK.
          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              gs = gradle.read_text()
              if re.search(r'compileSdk\s*=\s*[^,\n]+', gs):
                  gs = re.sub(r'compileSdk\s*=\s*[^,\n]+', 'compileSdk = 36', gs, count=1)
              gradle.write_text(gs)
          else:
              gradle = Path("android/app/build.gradle")
              if gradle.exists():
                  gs = gradle.read_text()
                  gs = re.sub(r'compileSdkVersion\s+[^,\n]+', 'compileSdkVersion 36', gs, count=1)
                  gradle.write_text(gs)

          p.write_text(s)
          print("Notification and audio configuration completed")
          PY

      - name: Enable Core Library Desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")

          if p.exists():
              is_kts = True
          else:
              p = Path("android/app/build.gradle")
              is_kts = False

          if not p.exists():
              raise SystemExit("Android Gradle file not found")

          s = p.read_text()

          if is_kts:
              setting = "isCoreLibraryDesugaringEnabled = true"
              dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'

              pattern = r'isCoreLibraryDesugaringEnabled\s*=\s*(true|false)'
              if re.search(pattern, s):
                  s = re.sub(pattern, setting, s, count=1)
              else:
                  s, count = re.subn(
                      r'compileOptions\s*\{',
                      lambda m: m.group(0) + '\n        ' + setting,
                      s,
                      count=1
                  )
                  if count == 0:
                      raise SystemExit("compileOptions block not found")

          else:
              setting = "coreLibraryDesugaringEnabled true"
              dependency = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

              pattern = r'coreLibraryDesugaringEnabled\s+(true|false)'
              if re.search(pattern, s):
                  s = re.sub(pattern, setting, s, count=1)
              else:
                  s, count = re.subn(
                      r'compileOptions\s*\{',
                      lambda m: m.group(0) + '\n        ' + setting,
                      s,
                      count=1
                  )
                  if count == 0:
                      raise SystemExit("compileOptions block not found")

          if "desugar_jdk_libs" not in s:
              match = re.search(r'(?m)^dependencies\s*\{', s)
              if match:
                  pos = match.end()
                  s = s[:pos] + '\n' + dependency + s[pos:]
              else:
                  s += '\n\ndependencies {\n' + dependency + '\n}\n'

          p.write_text(s)
          print("Core Library Desugaring configured successfully")
          PY

      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ziyarat-Ashura-APK
          path: build/app/outputs/flutter-apk/app-release.apk
