
name: Build Ziyarat Ashura APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform
        run: flutter create --platforms=android .

      - name: Configure notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in s:
                  s = re.sub(
                      r'(<application\b)',
                      tag + '\n    \\1',
                      s,
                      count=1
                  )

          receivers = '''
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />

              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
          '''

          if "ScheduledNotificationReceiver" not in s:
              s = s.replace("</application>", receivers + "\n</application>")

          p.write_text(s)
          print("Notification permissions configured")
          PY

      - name: Enable Core Library Desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")

          if p.exists():
              is_kts = True
          else:
              p = Path("android/app/build.gradle")
              is_kts = False

          if not p.exists():
              raise SystemExit("Android Gradle file not found")

          s = p.read_text()

          if is_kts:
              setting = "isCoreLibraryDesugaringEnabled = true"
              dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              setting = "coreLibraryDesugaringEnabled true"
              dependency = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if setting not in s:
              s, count = re.subn(
                  r'compileOptions\s*\{',
                  lambda m: m.group(0) + '\n        ' + setting,
                  s,
                  count=1
              )
              if count == 0:
                  raise SystemExit("compileOptions block not found")

          if "coreLibraryDesugaring" not in s:
              match = re.search(r'(?m)^dependencies\s*\{', s)
              if match:
                  pos = match.end()
                  s = s[:pos] + '\n' + dependency + s[pos:]
              else:
                  s += '\n\ndependencies {\n' + dependency + '\n}\n'

          p.write_text(s)
          print("Desugaring configured successfully")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ziyarat-Ashura-APK
          path: build/app/outputs/flutter-apk/app-release.apk
