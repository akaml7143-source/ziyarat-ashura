name: Deploy Firebase announcement service

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with Firebase service account
        id: auth
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Node.js
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        run: npm install --global firebase-tools

      - name: Install function dependencies
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        working-directory: functions
        run: npm install --omit=dev

      - name: Deploy function and Firestore rules
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only functions,firestore:rules --project ziyarat-ashura-796c7 --non-interactive

      - name: Explain missing deployment credentials
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON == '' }}
        run: echo "::warning::Set FIREBASE_SERVICE_ACCOUNT_JSON with Firebase deployment permissions to activate announcement push notifications."
