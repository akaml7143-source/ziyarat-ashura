name: Deploy Firebase announcement service

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Cloud Functions JavaScript
        run: node --check functions/index.js

      - name: Authenticate with Firebase service account
        id: auth
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Node.js
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        run: npm install --global firebase-tools

      - name: Install function dependencies
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        working-directory: functions
        run: npm install --omit=dev

      - name: Deploy function and Firestore rules
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only functions,firestore:rules,firestore:indexes --project ziyarat-ashura-796c7 --non-interactive

      - name: Fail when deployment credentials are missing
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON == '' }}
        run: |
          echo "::error::Firebase deployment was not performed. Set FIREBASE_SERVICE_ACCOUNT_JSON with a service account that can enable required Google Cloud APIs and deploy Cloud Functions, Firestore rules, and indexes."
          exit 1
