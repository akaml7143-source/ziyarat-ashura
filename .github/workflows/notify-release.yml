name: Notify users about a published app update

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Authenticate with Firebase service account
        id: auth
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging

      - name: Send update notification to all subscribed devices
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          for language in ar fa en; do
            export LANGUAGE_CODE="$language"
            python3 - <<'PY' > payload.json
          import json, os
          lang = os.environ.get("LANGUAGE_CODE", "ar")
          tag = os.environ.get("RELEASE_TAG", "1.0")
          url = os.environ.get("RELEASE_URL", "")
          messages = {
            "ar": ("تحديث جديد لتطبيق زيارة عاشوراء", f"يتوفر الآن الإصدار {tag}. اضغط لمعرفة التفاصيل وتنزيل التحديث."),
            "fa": ("به‌روزرسانی جدید زیارت عاشورا", f"نسخه {tag} منتشر شد. برای مشاهده جزئیات و دریافت آن بزنید."),
            "en": ("New Ziyarat Ashura update", f"Version {tag} is available. Tap to view details and download it."),
          }
          title, body = messages.get(lang, messages["ar"])
          print(json.dumps({"message": {
            "topic": f"app_updates_{lang}",
            "notification": {"title": title, "body": body},
            "data": {"release_url": url, "version": tag, "language": lang},
            "android": {"priority": "HIGH"}
          }}, ensure_ascii=False))
          PY
            curl --fail-with-body --silent --show-error \
              -X POST \
              "https://fcm.googleapis.com/v1/projects/ziyarat-ashura-796c7/messages:send" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data-binary @payload.json
          done

      - name: Explain missing Firebase credentials
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON == '' }}
        run: |
          echo "::warning::Set the repository Actions secret FIREBASE_SERVICE_ACCOUNT_JSON to a Firebase service-account JSON with Firebase Cloud Messaging send permission. No broadcast was sent."
